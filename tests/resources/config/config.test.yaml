project_name: "text2cypher-finetune-test"

logging:
  log_path: "logs"

model:
  type: "llama"
  name: "hf-internal-testing/tiny-random-LlamaForCausalLM"  # tiny model for fast tests
  quantization: false
  quantization_type: "4bit"
  peft_method: "lora"
  max_length: 256

lora:
  r: 4
  alpha: 4
  dropout: 0.1
  prompt_tuning_n_tokens: 8

training:
  batch_size: 2
  accumulate_grad_batches: 1
  learning_rate: 1e-5
  warmup_steps: 10
  weight_decay: 0.0
  patience: 2
  precision: "16-mixed"
  gradient_clip_val: 1.0
  max_epochs: 1
  num_workers: 0
  model_artifact_dir: "tests/resources/artifacts"
  devices: "auto"

data:
  train_samples: 5
  val_samples: 2
  test_samples: 2
  shuffle: false
  shuffle_seed: 42
  shuffle_buffer_size: 128
  source_data_folder: "tests/resources"
  source_data_path: "text2cypher.parquet"
  source_train_data_path: "text2cypher_train.parquet"
  source_test_data_path: "text2cypher_test.parquet"
  preprocessed_output_data_folder: "tests/resources"
  preprocessed_input_data_folder: "tests/resources"
  apply_quality_filters: false
  min_text_length: 5
  min_cypher_length: 3
  max_length_ratio: 0.9
  min_length_ratio: 0.01
  val_from_test_ratio: 0.5

evaluation:
  model_artifact_dir: "tests/resources/artifacts"
  test_samples_lexical_metrics: 2
  test_samples_semantic_metrics: 2
  test_samples_ai_as_judge_metrics: 0

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null

