name: Provision EC2 Debug Instance

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment (e.g., dev)"
        required: true
        default: dev
      instance_type:
        description: "EC2 Instance Type"
        required: true
        default: g4dn.xlarge

jobs:
  provision:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      EC2_SSH_KEY_NAME: ${{ secrets.EC2_SSH_KEY_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Terraform Init
        working-directory: terraform/ec2-debug
        env:
          TF_CLI_ARGS_init: "-input=false"
        run: terraform init

      - name: Terraform Plan
        id: plan
        working-directory: terraform/ec2-debug
        env:
          TF_CLI_ARGS_plan: "-input=false"
        run: |
          terraform plan \
            -var="environment=${{ github.event.inputs.environment }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="instance_type=${{ github.event.inputs.instance_type }}" \
            -var="ssh_key_name=${{ env.EC2_SSH_KEY_NAME }}"

      - name: Terraform Apply
        if: ${{ github.event.inputs.auto_apply == 'true' || true }}
        working-directory: terraform/ec2-debug
        env:
          TF_CLI_ARGS_apply: "-input=false -auto-approve"
        run: |
          terraform apply \
            -var="environment=${{ github.event.inputs.environment }}" \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="instance_type=${{ github.event.inputs.instance_type }}" \
            -var="ssh_key_name=${{ env.EC2_SSH_KEY_NAME }}" \
            -auto-approve

      - name: Output Instance Info
        working-directory: terraform/ec2-debug
        run: |
          echo "Instance ID: $(terraform output -raw instance_id)"
          echo "Public IP: $(terraform output -raw instance_public_ip)"
          echo "Public DNS: $(terraform output -raw instance_public_dns)"

