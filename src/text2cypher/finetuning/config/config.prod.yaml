project_name: "text2cypher-finetune"

logging:
  log_path: "logs"

model:
  type: "llama"
  name: "meta-llama/CodeLlama-7b-Instruct-hf"
  quantization: true
  quantization_type: "4bit"
  peft_method: "lora"
  max_length: 2048  # Full length for production

lora:
  r: 16
  alpha: 32
  dropout: 0.1
  prompt_tuning_n_tokens: 10

training:
  batch_size: 1  # Minimum for large model
  accumulate_grad_batches: 32  # Effective batch size = 1 * 32 = 32
  learning_rate: 1e-5
  warmup_steps: 200
  weight_decay: 0.01
  patience: 8
  precision: "16-mixed"
  gradient_clip_val: 1.0
  max_epochs: 5  # More epochs for production
  num_workers: 4
  # ROUGE evaluation settings
  rouge_eval_frequency: 50
  rouge_eval_samples: 10
  model_artifact_dir: "/opt/ml/processing/output/model-artifacts"
  devices: "auto"
  gradient_checkpointing: true
  # Memory optimization settings
  enable_model_summary: false
  log_every_n_steps: 25
  sync_batchnorm: false
  deterministic: false
  benchmark: false
  # Memory management
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  val_check_interval: 1.0
  check_val_every_n_epoch: 1
  # Learning rate scheduling
  lr_scheduler:
    name: "linear_warmup"
    T_max: 25
    eta_min: 1e-6
    step_size: 3
    gamma: 0.5

data:
  train_samples: 3500  # Production sample size
  val_samples: 500     # Production validation size
  test_samples: 500    # Production test size
  shuffle: true
  shuffle_seed: 42
  shuffle_buffer_size: 10000
  source_data_folder: "/opt/ml/processing/input/source-data"
  source_data_path: "text2cypher_train.parquet"
  preprocessed_output_data_folder: "/opt/ml/processing/output"
  preprocessed_input_data_folder: "/opt/ml/processing/input"
  # Data quality filtering settings
  apply_quality_filters: true
  min_cypher_length: 10
  min_text_length: 20
  max_length_ratio: 0.8
  min_length_ratio: 0.01

evaluation:
  model_artifact_dir: "/opt/ml/processing/input/model-artifacts"
  test_samples_lexical_metrics: 50
  test_samples_semantic_metrics: 20
  test_samples_ai_as_judge_metrics: 10