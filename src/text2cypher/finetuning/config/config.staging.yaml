project_name: "text2cypher-finetune"

logging:
  log_path: "logs"

model:
  type: "llama"
  name: "meta-llama/Llama-3.2-3B-Instruct"
  quantization: true
  quantization_type: "4bit"
  peft_method: "lora"
  max_length: 1536

lora:
  r: 16
  alpha: 32
  dropout: 0.1
  prompt_tuning_n_tokens: 10

training:
  batch_size: 2  # Reduced for larger model
  accumulate_grad_batches: 16  # Effective batch size = 2 * 16 = 32
  learning_rate: 1e-5
  warmup_steps: 100
  weight_decay: 0.01
  patience: 5
  precision: "16-mixed"
  gradient_clip_val: 1.0
  max_epochs: 3
  num_workers: 2
  # ROUGE evaluation settings
  rouge_eval_frequency: 20
  rouge_eval_samples: 5
  model_artifact_dir: "/opt/ml/processing/output/model-artifacts"
  devices: "auto"
  gradient_checkpointing: true
  # Memory optimization settings
  enable_model_summary: false
  log_every_n_steps: 10
  sync_batchnorm: false
  deterministic: false
  benchmark: false
  # Memory management
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  val_check_interval: 1.0
  check_val_every_n_epoch: 1
  # Learning rate scheduling
  lr_scheduler:
    name: "linear_warmup"
    T_max: 15
    eta_min: 1e-6
    step_size: 2
    gamma: 0.5

data:
  train_samples: 800  # Staging sample size
  val_samples: 100    # Staging validation size
  test_samples: 100   # Staging test size
  shuffle: true
  shuffle_seed: 42
  shuffle_buffer_size: 5000
  source_data_folder: "/opt/ml/processing/input/source-data"
  source_data_path: "text2cypher_train.parquet"
  preprocessed_output_data_folder: "/opt/ml/processing/output"
  preprocessed_input_data_folder: "/opt/ml/processing/input"
  # Data quality filtering settings
  apply_quality_filters: true
  min_cypher_length: 10
  min_text_length: 20
  max_length_ratio: 0.8
  min_length_ratio: 0.01

evaluation:
  model_artifact_dir: "/opt/ml/processing/input/model-artifacts"
  test_samples_lexical_metrics: 10
  test_samples_semantic_metrics: 10
  test_samples_ai_as_judge_metrics: 5